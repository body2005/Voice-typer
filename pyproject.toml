[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "sounddevice.*",
    "scipy.*",
    "keyring.*",
    "pynput.*",
    "keyboard.*",
    "win32gui.*",
    "win32clipboard.*",
    "win32con.*",
    "win32api.*",
]
ignore_missing_imports = true
